<nav class="fixed left-0 right-0 top-0 z-50 border-b border-gray-100 bg-white">
  <div class="mx-auto flex h-16 max-w-7xl items-center px-4 sm:px-6">
    <!-- Brand -->
    <a routerLink="/home" class="flex items-center gap-3">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
      >
        <path
          fill="#2563EB"
          d="M6 11v10c0 1.654 1.346 3 3 3h12c1.654 0 3-1.346 3-3V11zm13 5c0 2.206-1.794 4-4 4s-4-1.794-4-4v-2h2v2c0 1.103.897 2 2 2s2-.897 2-2v-2h2zM4 9h15V5h-5v-.5C14 2.019 11.981 0 9.5 0S5 2.019 5 4.5V5H0v11c0 1.654 1.346 3 3 3h1zm3-4.5C7 3.121 8.122 2 9.5 2S12 3.121 12 4.5V5H7z"
        />
      </svg>

      <span class="text-lg font-bold text-gray-900 md:text-xl">
        Shop Ease
      </span>
    </a>

    <!-- Navigation -->
    <div
      class="absolute left-1/2 hidden -translate-x-1/2 items-center gap-10 md:flex"
    >
      <a
        routerLink="/home"
        class="text-base font-medium text-gray-700 transition hover:text-blue-600"
      >
        Home
      </a>

      <a
        routerLink="/home"
        fragment="products"
        class="text-base font-medium text-gray-700 transition hover:text-blue-600"
      >
        Products
      </a>

      <a
        routerLink="/categories"
        class="text-base font-medium text-gray-700 transition hover:text-blue-600"
      >
        Categories
      </a>

      <a
        routerLink="/about"
        class="text-base font-medium text-gray-700 transition hover:text-blue-600"
      >
        About
      </a>
    </div>

    <div class="relative ml-auto flex items-center gap-3 md:gap-5">
      <!-- Cart -->
      <button
        type="button"
        class="relative text-gray-600 transition hover:text-blue-600"
        aria-label="Shopping cart"
      >
        <lucide-icon [img]="ShoppingCart" [size]="22" />

        <span
          *ngIf="cartCount$ | async as count"
          class="absolute -right-2 -top-2 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-medium leading-none text-white"
        >
          {{ count }}
        </span>
      </button>

      <!-- Profile -->
      <button
        type="button"
        (click)="toggleUserMenu()"
        class="rounded-full p-2 text-gray-600 transition hover:bg-gray-100 hover:text-gray-900"
      >
        <lucide-icon [img]="User" [size]="20" />
      </button>

      <div
        *ngIf="showUserMenu"
        class="absolute right-0 top-12 z-50 w-48 rounded-xl border border-gray-100 bg-white p-2 shadow-lg"
      >
        <button
          type="button"
          (click)="logout()"
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-600 transition hover:bg-gray-100 hover:text-gray-900"
        >
          <lucide-icon [img]="LogOut" [size]="18" />
          Logout
        </button>
      </div>
    </div>
  </div>
</nav>
